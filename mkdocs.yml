# Ejercicio 1 · Presentación del proyecto Partida Guardada
site_name: Partida Guardada
site_description: Presentación de Partida Guardada, una plataforma para organizar tu colección de videojuegos
site_author: Josep Pérez Morente
site_url: https://luciuss04.github.io/Partida_Guardada-Ejercicio1/
copyright: Proyecto Intermodular · 2º DAM · Josep Pérez Morente

docs_dir: docs

nav:
  - Inicio: index.md
  - El proyecto: proyecto.md
  - Funcionalidades: funcionalidades.md
  - Público objetivo: publico.md
  - Sobre esta web: sobre-esta-web.md

theme:
  name: material
  language: es
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/content-save-outline
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: es

extra_css:
  - estilos/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
